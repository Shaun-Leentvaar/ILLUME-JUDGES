<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Illume 2026 — Judge Tracker</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap');

  :root {
    --bg: #f4f3f0;
    --surface: #ffffff;
    --border: #e8e6e1;
    --border2: #d4d1ca;
    --text: #1c1b19;
    --text2: #706e69;
    --text3: #b0aea8;
    --accent: #2d6a4f;

    --c-yes-bg: #d1fae5;
    --c-yes-text: #065f46;
    --c-yes-dot: #10b981;

    --c-req-bg: #fef3c7;
    --c-req-text: #92400e;
    --c-req-dot: #f59e0b;

    --c-todo-bg: #dbeafe;
    --c-todo-text: #1e40af;
    --c-todo-dot: #3b82f6;

    --c-no-bg: #fee2e2;
    --c-no-text: #991b1b;
    --c-no-dot: #ef4444;

    --c-na-bg: #f3f4f6;
    --c-na-text: #9ca3af;

    --c-wait-bg: #ede9fe;
    --c-wait-text: #5b21b6;

    --row-complete: #ecfdf5;
    --row-complete-hover: #d1fae5;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    line-height: 1.5;
  }

  /* ── Header ── */
  .header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 1rem 1.75rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 50;
  }

  .brand { display: flex; align-items: center; gap: 10px; }

  .brand-dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--accent);
  }

  .brand-name {
    font-size: 13px; font-weight: 600;
    letter-spacing: 0.03em; color: var(--text);
  }

  .brand-sep { color: var(--text3); }

  .brand-sub { font-size: 12px; color: var(--text2); }

  .sync-pill {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px; color: var(--text3);
    background: var(--bg);
    border: 1px solid var(--border2);
    padding: 3px 10px; border-radius: 20px;
  }

  /* ── Stats ── */
  .stats {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    background: var(--surface);
    border-bottom: 1px solid var(--border);
  }

  .stat {
    padding: 1rem 1.75rem;
    border-right: 1px solid var(--border);
  }

  .stat:last-child { border-right: none; }

  .stat-num {
    font-size: 26px; font-weight: 600;
    font-family: 'JetBrains Mono', monospace;
    color: var(--accent); line-height: 1;
    margin-bottom: 3px;
  }

  .stat-lbl {
    font-size: 10px; font-weight: 500;
    text-transform: uppercase; letter-spacing: 0.08em;
    color: var(--text3);
  }

  /* ── Legend ── */
  .legend-bar {
    background: var(--row-complete);
    border-bottom: 1px solid #a7f3d0;
    padding: 0.5rem 1.75rem;
    display: flex;
    align-items: center;
    gap: 1.5rem;
    flex-wrap: wrap;
  }

  .legend-title {
    font-size: 10px; font-weight: 600;
    text-transform: uppercase; letter-spacing: 0.08em;
    color: var(--accent);
  }

  .legend-items { display: flex; gap: 16px; flex-wrap: wrap; }

  .li {
    display: flex; align-items: center; gap: 6px;
    font-size: 11px; color: var(--text2);
  }

  .li-dot { width: 8px; height: 8px; border-radius: 50%; }

  /* ── Controls ── */
  .controls {
    background: var(--surface);
    border-bottom: 2px solid var(--border2);
    padding: 0.75rem 1.75rem;
    display: flex; gap: 8px;
    align-items: center; flex-wrap: wrap;
  }

  .search {
    background: var(--bg);
    border: 1px solid var(--border2);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    font-size: 12px;
    padding: 6px 12px;
    border-radius: 6px;
    width: 220px; outline: none;
    transition: border-color 0.15s;
  }

  .search:focus { border-color: var(--accent); }
  .search::placeholder { color: var(--text3); }

  .fbtn {
    background: var(--bg);
    border: 1px solid var(--border2);
    color: var(--text2);
    font-family: 'Inter', sans-serif;
    font-size: 11px; font-weight: 500;
    padding: 5px 12px;
    border-radius: 6px;
    cursor: pointer;
    transition: all 0.12s;
  }

  .fbtn:hover { border-color: var(--accent); color: var(--accent); }
  .fbtn.active { background: var(--accent); color: #fff; border-color: var(--accent); }

  .cat-select {
    margin-left: auto;
    background: var(--bg);
    border: 1px solid var(--border2);
    color: var(--text2);
    font-family: 'Inter', sans-serif;
    font-size: 11px; font-weight: 500;
    padding: 5px 12px;
    border-radius: 6px; cursor: pointer; outline: none;
  }

  /* ── Table ── */
  .table-wrap { overflow-x: auto; }

  table { width: 100%; border-collapse: collapse; }

  thead {
    position: sticky; top: 57px; z-index: 10;
    background: #f9f8f6;
    border-bottom: 2px solid var(--border2);
  }

  th {
    padding: 9px 14px;
    text-align: left;
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px; font-weight: 500;
    color: var(--text3);
    text-transform: uppercase;
    letter-spacing: 0.1em;
    white-space: nowrap;
  }

  th.th-center { text-align: center; }

  td {
    padding: 10px 14px;
    border-bottom: 1px solid var(--border);
    vertical-align: middle;
    background: var(--surface);
  }

  td.td-center { text-align: center; }

  tbody tr { cursor: pointer; transition: background 0.1s; }
  tbody tr:hover td { background: #f9f8f6; }
  tbody tr.row-done td { background: var(--row-complete); }
  tbody tr.row-done:hover td { background: var(--row-complete-hover); }

  /* ── Judge name cell ── */
  .j-name { font-weight: 600; font-size: 13px; color: var(--text); }
  .j-sub {
    font-size: 10px; color: var(--text3);
    font-family: 'JetBrains Mono', monospace;
    margin-top: 2px;
  }

  /* ── Category tag ── */
  .cat {
    display: inline-block;
    padding: 2px 8px; border-radius: 4px;
    font-size: 10px; font-weight: 600;
    text-transform: uppercase; letter-spacing: 0.05em;
    white-space: nowrap;
  }

  .cat-Adventure { background: #fef9c3; color: #854d0e; }
  .cat-Aerial    { background: #e0f2fe; color: #075985; }
  .cat-Bike      { background: #fce7f3; color: #9d174d; }
  .cat-Climb     { background: #f3e8ff; color: #6b21a8; }
  .cat-Skate     { background: #ffedd5; color: #9a3412; }
  .cat-Snow      { background: #dbeafe; color: #1e40af; }
  .cat-Surf      { background: #ccfbf1; color: #0f766e; }
  .cat-Trail     { background: #dcfce7; color: #166534; }
  .cat-Theme     { background: #f1f5f9; color: #334155; }

  /* ── Status indicator (icon + label) ── */
  .pill {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 3px 9px; border-radius: 20px;
    font-size: 10px; font-weight: 600;
    white-space: nowrap;
  }

  .pill-dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }

  .p-yes  { background: var(--c-yes-bg); color: var(--c-yes-text); }
  .p-yes .pill-dot  { background: var(--c-yes-dot); }

  .p-req  { background: var(--c-req-bg); color: var(--c-req-text); }
  .p-req .pill-dot  { background: var(--c-req-dot); }

  .p-todo { background: var(--c-todo-bg); color: var(--c-todo-text); }
  .p-todo .pill-dot { background: var(--c-todo-dot); }

  .p-no   { background: var(--c-no-bg); color: var(--c-no-text); }
  .p-no .pill-dot   { background: var(--c-no-dot); }

  .p-na   { background: var(--c-na-bg); color: var(--c-na-text); }
  .p-na .pill-dot   { background: #d1d5db; }

  .p-wait { background: var(--c-wait-bg); color: var(--c-wait-text); }
  .p-wait .pill-dot { background: #8b5cf6; }

  .p-declined { background: var(--c-no-bg); color: var(--c-no-text); }
  .p-declined .pill-dot { background: var(--c-no-dot); }

  /* ── Check icon cells ── */
  .check { font-size: 15px; }

  /* ── Expanded detail ── */
  .detail-row td {
    background: #f0fdf4 !important;
    padding: 14px 20px 18px 56px;
    border-bottom: 1px solid #a7f3d0;
  }

  .detail-inner {
    display: grid;
    grid-template-columns: 200px 1fr 1fr;
    gap: 20px;
  }

  .di-section h5 {
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px; font-weight: 500;
    text-transform: uppercase; letter-spacing: 0.1em;
    color: var(--text3); margin-bottom: 6px;
  }

  .di-section p { font-size: 12px; color: var(--text2); line-height: 1.6; }

  .di-pills { display: flex; flex-wrap: wrap; gap: 4px; }

  /* ── Empty ── */
  .empty-row td {
    text-align: center; padding: 3rem;
    color: var(--text3);
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    background: var(--surface) !important;
  }

  /* ── Footer ── */
  .footer {
    padding: 1rem 1.75rem;
    border-top: 1px solid var(--border);
    display: flex; justify-content: space-between;
    background: var(--surface);
  }

  .footer span {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px; color: var(--text3);
  }

  @media (max-width: 768px) {
    .stats { grid-template-columns: repeat(2,1fr); }
    .detail-inner { grid-template-columns: 1fr; }
  }
</style>
</head>

  </table>
</div>

<div class="footer">

</div>

function pillClass(v) {
  if (v === 'YES') return 'p-yes';
  if (v === 'REQUESTED' || v === 'INCOMPLETE') return 'p-req';
  if (v === 'TO DO') return 'p-todo';
  if (v === 'NO') return 'p-no';
  if (v === 'N/A' || v === 'NOT REQ') return 'p-na';
  return 'p-na';
}

function pillLabel(v) {
  const m = { 'YES':'Yes', 'REQUESTED':'Requested', 'TO DO':'To Do', 'NO':'No', 'N/A':'N/A', 'NOT REQ':'N/A', 'INCOMPLETE':'Incomplete', 'WFF':'Waiting' };
  return m[v] || (v || '—');
}

function pill(v) {
  if (!v) return '<span style="color:#d1d5db;font-size:11px">—</span>';
  return `<span class="pill ${pillClass(v)}"><span class="pill-dot"></span>${pillLabel(v)}</span>`;
}

function acceptedPill(v) {
  if (v === 'YES') return `<span class="pill p-yes"><span class="pill-dot"></span>Confirmed</span>`;
  if (v === 'WFF') return `<span class="pill p-wait"><span class="pill-dot"></span>Waiting</span>`;
  if (v === 'NO') return `<span class="pill p-declined"><span class="pill-dot"></span>Declined</span>`;
  return '—';
}

let filter = 'all', expanded = new Set();

function setFilter(f, btn) {
  filter = f;
  document.querySelectorAll('.fbtn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  render();
}

function toggleRow(i) {
  expanded.has(i) ? expanded.delete(i) : expanded.add(i);
  render();
}

function render() {
  const q = document.getElementById('search').value.toLowerCase();
  const cat = document.getElementById('catFilter').value;

  const filtered = judges.filter(j => {
    const mq = j.name.toLowerCase().includes(q) || j.org.toLowerCase().includes(q) || j.country.toLowerCase().includes(q) || j.type.toLowerCase().includes(q);
    const mc = !cat || j.cat === cat;
    let mf = true;
    if (filter === 'YES') mf = j.accepted === 'YES';
    else if (filter === 'WFF') mf = j.accepted === 'WFF';
    else if (filter === 'NO') mf = j.accepted === 'NO';
    else if (filter === 'incomplete') mf = j.accepted === 'YES' && (j.live !== 'YES' || j.portrait !== 'YES' || j.bio !== 'YES');
    return mq && mc && mf;
  });

  const confirmed = judges.filter(j => j.accepted === 'YES').length;
  const live = judges.filter(j => j.live === 'YES').length;
  const wff = judges.filter(j => j.accepted === 'WFF').length;
  const social = judges.filter(j => j.social === 'YES').length;

  document.getElementById('stats').innerHTML = `
    <div class="stat"><div class="stat-num">${judges.length}</div><div class="stat-lbl">Total Tracked</div></div>
    <div class="stat"><div class="stat-num">${confirmed}</div><div class="stat-lbl">Confirmed</div></div>
    <div class="stat"><div class="stat-num">${live}</div><div class="stat-lbl">Profile Live</div></div>
    <div class="stat"><div class="stat-num">${social}</div><div class="stat-lbl">Social Story Done</div></div>
  `;

  document.getElementById('count').textContent = `${filtered.length} of ${judges.length} judges`;

  const tbody = document.getElementById('tbody');
  if (!filtered.length) {
    tbody.innerHTML = '<tr class="empty-row"><td colspan="11">No judges found</td></tr>';
    return;
  }

  tbody.innerHTML = filtered.map(j => {
    const i = judges.indexOf(j);
    const isOpen = expanded.has(i);
    const isDone = j.live === 'YES' && j.profile === 'YES' && j.social === 'YES';

    const main = `
      <tr class="${isDone ? 'row-done' : ''}" onclick="toggleRow(${i})">
        <td>
          <div class="j-name">${j.name}</div>
          <div class="j-sub">${j.org} · ${j.country}</div>
        </td>
        <td><span class="cat cat-${j.cat}">${j.cat}</span></td>
        <td style="font-size:11px;color:var(--text2)">${j.type}</td>
        <td>${acceptedPill(j.accepted)}</td>
        <td class="td-center">${pill(j.portrait)}</td>
        <td class="td-center">${pill(j.bio)}</td>
        <td class="td-center">${pill(j.quotes)}</td>
        <td class="td-center">${pill(j.video)}</td>
        <td class="td-center">${pill(j.profile)}</td>
        <td class="td-center">${pill(j.live)}</td>
        <td class="td-center">${pill(j.social)}</td>
      </tr>`;

    const detail = isOpen ? `
      <tr class="detail-row">
        <td colspan="11">
          <div class="detail-inner">
            <div class="di-section">
              <h5>Contact</h5>
              <p style="font-family:'JetBrains Mono',monospace;font-size:11px">${j.contact}</p>
            </div>
            <div class="di-section">
              <h5>All deliverables</h5>
              <div class="di-pills">
                ${['portrait','bio','quotes','video','profile','live','social'].map(k =>
                  `<span class="pill ${pillClass(j[k])}" style="font-size:10px"><span class="pill-dot"></span>${k}: ${pillLabel(j[k])||'—'}</span>`
                ).join('')}
              </div>
            </div>
            <div class="di-section">
              <h5>Notes</h5>
              <p>${j.notes || 'No notes.'}</p>
            </div>
          </div>
        </td>
      </tr>` : '';

    return main + detail;
  }).join('');
}

render();
</script>
